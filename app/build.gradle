plugins {
    id 'com.android.application'
}

import groovy.json.JsonOutput

def firebaseAndroidAppId = (System.getenv('TALLER_FIREBASE_ANDROID_APP_ID') ?: '').trim()

android {
    namespace 'ar.scantec.taller20'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.scantec.taller20'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.1-push-prueba'
        buildConfigField 'String', 'FIREBASE_ANDROID_APP_ID', JsonOutput.toJson(firebaseAndroidAppId)
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'
}
