function updateGreeting(){
  const el=document.getElementById('userWelcome');
  if(!el||!activeUser)return;
  const hour=new Date().getHours();
  const greeting=hour>=5&&hour<12?'Buen día':hour>=12&&hour<20?'Buenas tardes':'Buenas noches';
  const symbol=hour>=5&&hour<12?'☀️':hour>=12&&hour<20?'🌤️':'🌙';
  const googleProfile=activeUser.providerData?.find(p=>p.providerId==='google.com');
  const fullName=String(googleProfile?.displayName||activeUser.displayName||'').trim();
  const firstName=fullName?fullName.split(/\s+/)[0]:'';
  el.textContent=symbol+' ¡'+greeting+(firstName?', '+firstName:'')+'! Bienvenido a Taller 2.0.';
}

const ACCESS_SESSION_KEY='taller20_access_session_v1';
let accessWritePending=false;
// Una apertura de sesión cuenta una sola vez, aunque la página se actualice.
function forgetAccessSession(){try{sessionStorage.removeItem(ACCESS_SESSION_KEY)}catch(e){}}
async function recordAccess(user){
  if(!user?.uid||accessWritePending)return;
  try{if(sessionStorage.getItem(ACCESS_SESSION_KEY)===user.uid)return}catch(e){}
  accessWritePending=true;
  const google=user.providerData?.find(p=>p.providerId==='google.com');
  try{
    await setDoc(doc(db,'accessStats',user.uid),{
      email:user.email||'',
      displayName:String(google?.displayName||user.displayName||'').trim().slice(0,120),
      accessCount:increment(1),
      lastAccess:serverTimestamp()
    },{merge:true});
    try{sessionStorage.setItem(ACCESS_SESSION_KEY,user.uid)}catch(e){}
  }catch(e){
    console.warn('Registro de accesos no disponible: comprobá las reglas de Firebase.',e.code||e.message);
  }finally{accessWritePending=false}
}
async function accessDashboard(){
  if(!activeUser||!isAdmin)return home();
  view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>👥 Accesos</h2><p id="accessStatus">Cargando registro...</p>';
  try{
    const snap=await getDocs(collection(db,'accessStats'));
    if(!activeUser||!isAdmin||!document.getElementById('accessStatus'))return;
    const users=snap.docs.map(d=>d.data()).sort((a,b)=>(b.lastAccess?.toMillis?.()||0)-(a.lastAccess?.toMillis?.()||0));
    const total=users.reduce((n,u)=>n+(Number(u.accessCount)||0),0);
    const cards=users.map(u=>{
      const last=u.lastAccess?.toDate?.();
      const date=last?last.toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'Sin fecha';
      return '<div class="access-person"><strong>'+esc(u.displayName||'Nombre no disponible')+'</strong><small>'+esc(u.email||'')+'</small><small>🔁 Ingresos: '+(Number(u.accessCount)||0)+' · 🕒 Último acceso: '+esc(date)+'</small></div>';

    const el=document.getElementById('accessStatus');

  }
}

onAuthStateChanged(auth,async user=>{
  activeUser=null;isAdmin=false;
  if(!user){forgetAccessSession();loginScreen();return}
  document.getElementById('view').innerHTML='';
  authBox.textContent='Cargando tu espacio...';
  try{
    if(!user.providerData.some(p=>p.providerId==='google.com')){
      authBox.innerHTML='<h2>Actualizá tu acceso</h2><p>Para conservar tus notas y permisos de administrador, vinculá esta cuenta existente con Google una sola vez.</p><button class="google-login" id="linkGoogle" type="button"><span class="google-mark">G</span>Vincular con Google</button><button class="settings" id="exitLegacy" type="button">Salir</button><p id="authMessage" role="status"></p>';
      document.getElementById('linkGoogle').onclick=async()=>{
        const btn=document.getElementById('linkGoogle');btn.disabled=true;
        try{await linkWithPopup(user,googleProvider);location.reload()}
        catch(e){message(e);btn.disabled=false}
      };
      document.getElementById('exitLegacy').onclick=()=>signOut(auth);
      return;
    }
    let role=null;
    try{role=await getDoc(doc(db,'roles',user.uid))}
    catch(e){console.warn('No se pudo consultar el rol; se usará acceso estándar.',e.code||e.message)}
    if(auth.currentUser?.uid!==user.uid)return;
    activeUser=user;
    // Se usa la biblioteca fija, sin heredar vínculos antiguos de este dispositivo.
    driveOwnerEmail=DEFAULT_DRIVE_EMAIL;
    if(auth.currentUser?.uid!==user.uid)return;
    isAdmin=!!role&&role.exists()&&role.data().role==='admin';
    authBox.innerHTML='<p id="userWelcome" class="welcome-line"></p><p class="session-line">Sesión: '+esc(user.email||'Cuenta de Google')+' <button class="settings" id="logout" type="button">Cerrar sesión</button></p>';
    updateGreeting();
    document.getElementById('logout').onclick=()=>{forgetAccessSession();return signOut(auth)};
    home();
    recordAccess(user);
  }catch(err){
    authBox.innerHTML='<p role="alert">No se pudo cargar tu cuenta. Revisá la conexión y los permisos de Firebase.</p><button class="settings" id="logout" type="button">Salir</button>';
    document.getElementById('logout').onclick=()=>signOut(auth);
    document.getElementById('view').innerHTML='';
  }
});

const NOTES_KEY="taller20_notas_v1";async function notes(){if(!activeUser)return;const noteRef=doc(db,'users',activeUser.uid,'notes','personal');let value='';try{const snap=await getDoc(noteRef);value=snap.exists()?snap.data().content||'':''}catch(e){alert('No se pudieron cargar tus notas');return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>📝 Mi espacio</h2><p>Tu bloc de notas personal. Se guarda en tu cuenta privada.</p><textarea id="myNotes" placeholder="Anotá tareas, observaciones, recordatorios..." style="width:100%;min-height:320px;resize:vertical;padding:14px;border-radius:10px;background:#122237;color:white;border:1px solid #526a84;font:inherit"></textarea><p id="noteStatus">Los cambios se guardan automáticamente.</p>';const el=document.getElementById("myNotes");el.value=value;el.addEventListener("input",()=>{clearTimeout(window.noteTimer);window.noteTimer=setTimeout(async()=>{try{await setDoc(noteRef,{content:el.value,updatedAt:new Date().toISOString()});document.getElementById("noteStatus").textContent="Guardado en tu espacio privado ✓"}catch(e){document.getElementById("noteStatus").textContent="Error al guardar; revisá tu conexión"}},650)})}function home(){

function clearPdfPreview(){if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=null}}
function externalDriveLink(id){return '<p><a href="'+folderUrl(id)+'" target="_blank" rel="noopener">Abrir en Google Drive ↗</a></p>'}

async function openMachine(i){
  if(!activeUser)return;
  clearPdfPreview();currentMachineIndex=i;
  const machine=config.machines[i];if(!machine)return home();
  driveTrail=[{id:machine.folder,name:machine.name}];

function driveAccountField(){
  return '<button type="button" class="reconnect-icon" id="connectDrive" aria-label="Reintentar conexión" title="Reintentar conexión">⟳</button>';
}
function folderHeader(){
  const path=driveTrail.map((x,i)=>'<button type="button" class="back" data-trail="'+i+'">'+esc(x.name)+'</button>').join(' › ');
  return '<button class="back" onclick="home()">← Máquinas</button><div aria-label="Ruta de carpetas">'+path+'</div>';

function bindTrailButtons(){
  view.querySelectorAll('[data-trail]').forEach(b=>b.onclick=()=>{
    driveTrail=driveTrail.slice(0,Number(b.dataset.trail)+1);
    browseDriveFolder();
  });

function connectDriveScreen(error){
  if(!activeUser||currentMachineIndex===null)return home();
  const machine=config.machines[currentMachineIndex];if(!machine)return home();
  view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>'+esc(machine.name)+'</h2>'+
    driveAccountField()+'<p id="driveStatus" class="connection-state" role="alert">'+esc(error?.message||'La biblioteca no está disponible.')+'</p>'+
    '<p class="connection-hint">La cuenta de manuales nunca se ingresa en los teléfonos compartidos.</p>';
  document.getElementById('connectDrive').onclick=()=>browseDriveFolder();
}
function manageConnection(){
  if(!activeUser||!isAdmin)return home();
  view.innerHTML='<button class="back" onclick="home()">← Volver</button>'+
    '<h2>🔗 Gestionar conexión</h2>'+driveAccountField()+
    '<p id="driveStatus" class="connection-state">Biblioteca central: accesible desde tu propia sesión de Taller 2.0.</p>';
  document.getElementById('connectDrive').onclick=async()=>{
    const btn=document.getElementById('connectDrive');
    const status=document.getElementById('driveStatus');
    btn.disabled=true;status.textContent='Verificando servicio...';
    try{
      await libraryRequest(activeUser,'ping');
      status.textContent='Servidor de biblioteca conectado ✓';
    }catch(e){status.textContent='Conexión pendiente: '+e.message}
    finally{btn.disabled=false}
  };
}
async function browseDriveFolder(pageToken=''){
  if(!activeUser||currentMachineIndex===null)return home();
  clearPdfPreview();
  const current=driveTrail[driveTrail.length-1];if(!current)return home();
  if(!pageToken){
    view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2><p>Consultando manuales...</p>';
    bindTrailButtons();
  }
  try{
    const data=await libraryRequest(activeUser,'list',{folderId:current.id,cursor:pageToken});
    if(driveTrail[driveTrail.length-1]?.id!==current.id)return;
    if(!pageToken){
      view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2>'+
        '<p>Seleccioná una carpeta o un archivo.</p><div id="driveItems"></div>'+
        '<p id="driveStatus" role="status"></p>';
      bindTrailButtons();
    }
    const list=document.getElementById('driveItems');if(!list)return;
    const files=data.files||[];
    if(!pageToken&&!files.length)list.innerHTML='<p>Esta carpeta está vacía.</p>';
    const fragment=document.createDocumentFragment();
    files.sort((a,b)=>{
      const af=a.mimeType==='application/vnd.google-apps.folder'?0:1;
      const bf=b.mimeType==='application/vnd.google-apps.folder'?0:1;
      return af-bf||a.name.localeCompare(b.name,'es');
    });
    for(const file of files){
      const btn=document.createElement('button');
      btn.type='button';btn.className='card';
      btn.style.width='100%';btn.style.marginBottom='7px';
      const folder=file.mimeType==='application/vnd.google-apps.folder';
      btn.textContent=(folder?'📁 ':'📄 ')+file.name;
      btn.onclick=()=>{
        if(folder){driveTrail.push({id:file.id,name:file.name});browseDriveFolder();}
        else openDriveFile(file);
      };
      fragment.append(btn);
    }
    list.append(fragment);
    const old=document.getElementById('loadMoreDrive');if(old)old.remove();
    if(data.nextPageToken){
      const more=document.createElement('button');
      more.type='button';more.className='settings';more.id='loadMoreDrive';
      more.textContent='Cargar más archivos';
      more.onclick=()=>{more.disabled=true;browseDriveFolder(data.nextPageToken)};
      list.after(more);
    }
  }catch(e){
    if(!pageToken)return connectDriveScreen(e);
    const status=document.getElementById('driveStatus');
    if(status)status.textContent='Error al cargar más archivos: '+e.message;
  }
}
async function openDriveFile(file){
  if(!activeUser)return;
  clearPdfPreview();
  const native=String(file.mimeType).startsWith('application/vnd.google-apps.');
  const size=Number(file.size);
  const pdf=file.mimeType==='application/pdf'||/\.pdf$/i.test(file.name);
  if(native||!Number.isFinite(size)||size<=0||size>60*1024*1024){
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
      '<p>'+ (native?'Los archivos nativos de Google todavía no tienen vista previa.':
        'Este archivo no tiene un tamaño válido o supera el límite de 60 MB.')+'</p>';
    bindTrailButtons();return;
  }
  view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2><p id="fileProgress">Descargando archivo...</p>';
  bindTrailButtons();
  try{
    const parts=[];
    for(let offset=0;offset<size;offset+=LIBRARY_CHUNK_SIZE){
      const chunk=await libraryRequest(activeUser,'chunk',{fileId:file.id,offset});
      if(chunk.fileId!==file.id||chunk.offset!==offset||chunk.size!==size)
        throw Error('Los tramos descargados no coinciden');
      const binary=atob(chunk.data),bytes=new Uint8Array(binary.length);
      for(let n=0;n<binary.length;n++)bytes[n]=binary.charCodeAt(n);
      parts.push(bytes);
      const status=document.getElementById('fileProgress');
      if(status)status.textContent='Descargando: '+Math.round(Math.min(100,(offset+bytes.length)*100/size))+'%';
    }
    clearPdfPreview();
    pdfObjectUrl=URL.createObjectURL(new Blob(parts,{type:file.mimeType||'application/octet-stream'}));
    const name=esc(file.name);
    view.innerHTML=folderHeader()+'<h2>'+name+'</h2>'+
      (pdf?'<iframe title="Manual PDF" src="'+pdfObjectUrl+'" style="width:100%;height:75vh;border:1px solid #405c7a;border-radius:8px"></iframe>':'<p>Archivo listo para descargar.</p>')+
      '<p><a href="'+pdfObjectUrl+'" download="'+name+'">Descargar archivo</a></p>';
    bindTrailButtons();
  }catch(e){
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
      '<p role="alert">No se pudo abrir el archivo: '+esc(e.message)+'</p>';
    bindTrailButtons();
  }
}
function settings(){if(!isAdmin){home();return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){localStorage.setItem(KEY,JSON.stringify(config))}function saveRoot(){config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);config.machines.push({name,folder});persist();settings()}
function removeMachine(i){config.machines.splice(i,1);persist();settings()}
Object.assign(window,{home,notes,openMachine,settings,addMachine,removeMachine,saveRoot,manageConnection,accessDashboard});
</script></body></html>
