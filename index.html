const ACCESS_SESSION_KEY='taller20_access_session_v1';
let accessWritePending=false;
// Una apertura de sesión cuenta una sola vez, aunque la página se actualice.
function forgetAccessSession(){try{sessionStorage.removeItem(ACCESS_SESSION_KEY)}catch(e){}}
async function recordAccess(user){
  if(!user?.uid||accessWritePending)return;
  try{if(sessionStorage.getItem(ACCESS_SESSION_KEY)===user.uid)return}catch(e){}
  accessWritePending=true;
  const google=user.providerData?.find(p=>p.providerId==='google.com');
  try{
    await setDoc(doc(db,'accessStats',user.uid),{
      email:user.email||'',
      displayName:String(google?.displayName||user.displayName||'').trim().slice(0,120),
      accessCount:increment(1),
      lastAccess:serverTimestamp()
    },{merge:true});
    try{sessionStorage.setItem(ACCESS_SESSION_KEY,user.uid)}catch(e){}
  }catch(e){
    console.warn('Registro de accesos no disponible: comprobá las reglas de Firebase.',e.code||e.message);
  }finally{accessWritePending=false}
}
async function accessDashboard(){

  try{
    if(!user.providerData.some(p=>p.providerId==='google.com')){
      authBox.innerHTML='<h2>Actualizá tu acceso</h2><p>Para conservar tus notas y permisos de administrador, vinculá esta cuenta existente con Google una sola vez.</p><button class="google-login" id="linkGoogle" type="button"><span class="google-mark">G</span>Vincular con Google</button><button class="settings" id="exitLegacy" type="button">Salir</button><p id="authMessage" role="status"></p>';

        const btn=document.getElementById('linkGoogle');btn.disabled=true;

      };
      document.getElementById('exitLegacy').onclick=()=>signOut(auth);

    document.getElementById('view').innerHTML='';
  }

const NOTES_KEY="taller20_notas_v1";async function notes(){if(!activeUser)return;const noteRef=doc(db,'users',activeUser.uid,'notes','personal');let value='';try{const snap=await getDoc(noteRef);value=snap.exists()?snap.data().content||'':''}catch(e){alert('No se pudieron cargar tus notas');return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>📝 Mi espacio</h2><p>Tu bloc de notas personal. Se guarda en tu cuenta privada.</p><textarea id="myNotes" placeholder="Anotá tareas, observaciones, recordatorios..." style="width:100%;min-height:320px;resize:vertical;padding:14px;border-radius:10px;background:#122237;color:white;border:1px solid #526a84;font:inherit"></textarea><p id="noteStatus">Los cambios se guardan automáticamente.</p>';const el=document.getElementById("myNotes");el.value=value;el.addEventListener("input",()=>{clearTimeout(window.noteTimer);window.noteTimer=setTimeout(async()=>{try{await setDoc(noteRef,{content:el.value,updatedAt:new Date().toISOString()});document.getElementById("noteStatus").textContent="Guardado en tu espacio privado ✓"}catch(e){document.getElementById("noteStatus").textContent="Error al guardar; revisá tu conexión"}},650)})}function home(){

async function openMachine(i){
  if(!activeUser)return;
  clearPdfPreview();

  const m=config.machines[i];
  if(!m)return home();

async function authorizeDriveAccount(){
  if(!activeUser||!auth.currentUser||activeUser.uid!==auth.currentUser.uid)throw Error('La sesión de Taller cambió. Volvé a ingresar.');
  const email=DEFAULT_DRIVE_EMAIL;
  driveProvider.setCustomParameters({login_hint:email,prompt:''});
  const candidate=driveAuth.currentUser;
  const sameAccount=candidate?.email?.toLowerCase()===email;
  const result=sameAccount?await reauthenticateWithPopup(candidate,driveProvider):await signInWithPopup(driveAuth,driveProvider);
  const selected=result.user?.email?.trim().toLowerCase();
  if(!selected)throw Error('Google no informó qué cuenta autorizó el acceso.');
  if(selected!==email)throw Error('Google autorizó una cuenta diferente. Para acceder a los manuales, Google debe autorizar la cuenta preconfigurada.');
  const credential=GoogleAuthProvider.credentialFromResult(result);
  if(!credential?.accessToken)throw Error('Google no entregó permiso para leer Drive.');
  await rememberDriveEmail(selected);
  driveAccessToken=credential.accessToken;
  driveTokenExpiry=Date.now()+45*60*1000;
}

}

async function driveRequest(url,options={}){
  if(!driveAccessToken||Date.now()>driveTokenExpiry){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  const res=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+driveAccessToken}});
  if(res.status===401){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    throw Error(body.error?.message||('Google Drive devolvió error '+res.status));
  }
  return res;
}

function paintDriveFiles(){
  const listing=driveListing,el=document.getElementById('driveItems');
  if(!listing||!el||driveTrail[driveTrail.length-1]?.id!==listing.folderId)return;

  const found=text?listing.files.filter(f=>f.name.toLocaleLowerCase('es').includes(text)):listing.files;
  const perPage=80,total=found.length,pages=Math.max(1,Math.ceil(total/perPage));
  listing.page=Math.max(0,Math.min(listing.page,pages-1));
  const start=listing.page*perPage;
  const fragment=document.createDocumentFragment();
  for(const file of found.slice(start,start+perPage)){
    const btn=document.createElement('button');
    btn.type='button';btn.className='card';
    btn.style.width='100%';btn.style.marginBottom='7px';
    const folder=file.mimeType==='application/vnd.google-apps.folder';
    const pdf=file.mimeType==='application/pdf'||/\.pdf$/i.test(file.name);
    btn.textContent=(folder?'📁 ':pdf?'📕 ':'📄 ')+file.name;
    btn.onclick=()=>folder?(driveTrail.push({id:file.id,name:file.name}),browseDriveFolder()):openDriveFile(file);
    fragment.appendChild(btn);
  }
  el.replaceChildren(fragment);
  if(!total)el.textContent=listing.loading?'Buscando archivos…':text?'No hay archivos con ese nombre.':'Esta carpeta no contiene archivos visibles.';
  const count=document.getElementById('driveCount');
  if(count)count.textContent=(listing.loading?'Leyendo carpeta… ':'')+
    listing.files.length+' elementos cargados'+(text?' · '+total+' coincidencias':'')+
    (listing.loading?' (continúa la carga)':'');
  const nav=document.getElementById('drivePages');
  if(nav){
    nav.innerHTML=total>perPage?'<button type="button" class="settings" id="drivePrevious">← Anterior</button> '+
      '<span>Página '+(listing.page+1)+' de '+pages+'</span> '+
      '<button type="button" class="settings" id="driveNext">Siguiente →</button>':'';
    const prev=document.getElementById('drivePrevious'),next=document.getElementById('driveNext');
    if(prev){prev.disabled=listing.page===0;prev.onclick=()=>{listing.page--;paintDriveFiles();window.scrollTo({top:0,behavior:'smooth'})}}
    if(next){next.disabled=listing.page>=pages-1;next.onclick=()=>{listing.page++;paintDriveFiles();window.scrollTo({top:0,behavior:'smooth'})}}
  }
}
async function browseDriveFolder(){
  if(!activeUser||currentMachineIndex===null)return home();
  clearPdfPreview();
  if(!driveAccessToken||Date.now()>driveTokenExpiry)return connectDriveScreen();
  const current=driveTrail[driveTrail.length-1];
  if(!current)return home();
  const id=current.id,version=++driveListVersion;
  if(!/^[A-Za-z0-9_-]+$/.test(id))return;
  driveListing={folderId:id,files:[],query:'',page:0,loading:true};
  view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2>'+
    '<p>Carpetas, PDF y demás documentos. Podés buscar por nombre.</p>'+
    '<label>Buscar en esta carpeta<input id="driveSearch" type="search" placeholder="Nombre del archivo o manual…"></label>'+
    '<p id="driveCount" role="status">Leyendo carpeta…</p>'+
    '<div id="driveItems"></div><div id="drivePages"></div>'+
    '<p id="driveStatus" role="status"></p>';
  bindTrailButtons();
  document.getElementById('driveSearch').addEventListener('input',paintDriveFiles);
  paintDriveFiles();
  let pageToken='';
  try{
    do{
      const q="'"+id+"' in parents and trashed = false";
      const search=new URLSearchParams({q,fields:'nextPageToken,files(id,name,mimeType,webViewLink,size)',pageSize:'1000',orderBy:'folder,name'});
      if(pageToken)search.set('pageToken',pageToken);
      const response=await driveRequest('https://www.googleapis.com/drive/v3/files?'+search);
      const data=await response.json();
      if(version!==driveListVersion||driveTrail[driveTrail.length-1]?.id!==id||!document.getElementById('driveItems'))return;
      driveListing.files.push(...(data.files||[]));
      pageToken=data.nextPageToken||'';
      driveListing.loading=!!pageToken;
      paintDriveFiles();
    }while(pageToken);
  }catch(e){
    if(version!==driveListVersion)return;
    driveListing.loading=false;
    paintDriveFiles();
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    const status=document.getElementById('driveStatus');
    if(status)status.textContent='La lectura se interrumpió: '+e.message+
      '. Se conservan los '+driveListing.files.length+' archivos recuperados. Reconectá con ⟳ para continuar.';
  }finally{
    if(version===driveListVersion&&driveListing){driveListing.loading=false;paintDriveFiles()}
  }
}
async function openDriveFile(file){
  driveListVersion++;
  const driveLink=driveFileLink(file);
  if(file.mimeType!=='application/pdf'&&!/\.pdf$/i.test(file.name)){
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
      '<p>Este documento se abre en su aplicación compatible.</p>'+
      '<p><a target="_blank" rel="noopener" href="'+driveLink+'">Abrir documento ↗</a></p>';
    bindTrailButtons();return;
  }
  view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
    '<p id="pdfStatus" role="status">Cargando PDF…</p>'+
    '<p><a target="_blank" rel="noopener" href="'+driveLink+'">Abrir en Google Drive ↗</a></p>';
  bindTrailButtons();
  try{
    const response=await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');
    const blob=await response.blob();
    clearPdfPreview();
    pdfObjectUrl=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    const status=document.getElementById('pdfStatus');
    if(!status)return;
    const lib=window.pdfjsLib;
    const download='<p><a href="'+pdfObjectUrl+'" download="'+esc(file.name)+'">⬇ Descargar PDF</a> · '+
      '<a target="_blank" rel="noopener" href="'+driveLink+'">Abrir en Drive ↗</a></p>';
    if(!lib){
      status.textContent='Usando el visor del navegador.';
      status.insertAdjacentHTML('afterend','<iframe title="Manual PDF" src="'+pdfObjectUrl+
        '" style="width:100%;height:75vh;border:1px solid #405c7a;border-radius:8px"></iframe>'+download);
      return;
    }
    lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await lib.getDocument({url:pdfObjectUrl}).promise;
    if(!document.getElementById('pdfStatus'))return;
    let page=1,seq=0;
    status.insertAdjacentHTML('afterend','<div id="pdfControls">'+
      '<button class="settings" id="pdfPrev" type="button">← Anterior</button>'+
      '<span id="pdfNumber"></span>'+
      '<button class="settings" id="pdfNext" type="button">Siguiente →</button></div>'+
      '<canvas id="pdfCanvas" style="display:block;max-width:100%;margin:12px auto;background:white"></canvas>'+download);
    const canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d');
    async function renderPage(){
      const ticket=++seq;
      const one=await pdf.getPage(page);
      if(ticket!==seq||!canvas.isConnected)return;
      const natural=one.getViewport({scale:1});
      const width=Math.max(250,Math.min(900,view.clientWidth-12));
      const scale=width/natural.width;
      const pixelRatio=Math.min(window.devicePixelRatio||1,2);
      const viewport=one.getViewport({scale:scale*pixelRatio});
      canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);
      canvas.style.width=Math.round(viewport.width/pixelRatio)+'px';
      canvas.style.height=Math.round(viewport.height/pixelRatio)+'px';
      await one.render({canvasContext:ctx,viewport}).promise;
      if(ticket===seq&&canvas.isConnected){
        status.textContent='PDF cargado';
        document.getElementById('pdfNumber').textContent=' Página '+page+' de '+pdf.numPages+' ';
        document.getElementById('pdfPrev').disabled=page<=1;
        document.getElementById('pdfNext').disabled=page>=pdf.numPages;
      }
    }
    document.getElementById('pdfPrev').onclick=()=>{if(page>1){page--;renderPage()}};
    document.getElementById('pdfNext').onclick=()=>{if(page<pdf.numPages){page++;renderPage()}};
    await renderPage();
  }catch(e){
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    const status=document.getElementById('pdfStatus');
    if(status)status.textContent='No se pudo mostrar el PDF en este dispositivo ('+e.message+
      '). Podés abrirlo mediante el enlace de Google Drive.';
  }
}
function settings(){if(!isAdmin){home();return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){localStorage.setItem(KEY,JSON.stringify(config))}function saveRoot(){config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);config.machines.push({name,folder});persist();settings()}
function removeMachine(i){config.machines.splice(i,1);persist();settings()}
Object.assign(window,{home,notes,openMachine,settings,addMachine,removeMachine,saveRoot,manageConnection,accessDashboard});
</script></body></html>
