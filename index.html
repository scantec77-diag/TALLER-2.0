// La cuenta de origen se fija en el código. El correo no otorga permisos de Drive.
async function rememberDriveEmail(email){
  if(String(email||'').trim().toLowerCase()!==DEFAULT_DRIVE_EMAIL){
    throw Error('La cuenta de manuales autorizada no coincide con la configurada en Taller 2.0.');
  }
  driveOwnerEmail=DEFAULT_DRIVE_EMAIL;
}

const driveProvider=new GoogleAuthProvider();driveProvider.addScope('https://www.googleapis.com/auth/drive.readonly');
const googleProvider=new GoogleAuthProvider();
const authBox=document.createElement('section');authBox.id='authBox';authBox.setAttribute('aria-live','polite');authBox.textContent='Comprobando tu sesión...';document.querySelector('main').prepend(authBox);
const errors={
  'auth/operation-not-allowed':'El acceso con Google aún no está habilitado en Firebase Authentication.',
  'auth/unauthorized-domain':'Este dominio todavía no está autorizado en Firebase Authentication.',
  'auth/popup-blocked':'El navegador bloqueó la ventana de Google. Habilitá las ventanas emergentes e intentá de nuevo.',
  'auth/popup-closed-by-user':'Se canceló el ingreso. Podés volver a intentarlo.',

};
function message(e){const el=document.getElementById('authMessage');if(el)el.textContent=errors[e?.code]||e?.message||String(e)}
// El saludo usa solamente el nombre del perfil de Google; nunca deriva nombres del email.
function updateGreeting(){
  const el=document.getElementById('userWelcome');
  if(!el||!activeUser)return;
  const hour=new Date().getHours();
  const greeting=hour>=5&&hour<12?'Buen día':hour>=12&&hour<20?'Buenas tardes':'Buenas noches';
  const symbol=hour>=5&&hour<12?'☀️':hour>=12&&hour<20?'🌤️':'🌙';
  const googleProfile=activeUser.providerData?.find(p=>p.providerId==='google.com');
  const fullName=String(googleProfile?.displayName||activeUser.displayName||'').trim();
  const firstName=fullName?fullName.split(/\s+/)[0]:'';
  el.textContent=symbol+' ¡'+greeting+(firstName?', '+firstName:'')+'! Bienvenido a Taller 2.0.';
}
setInterval(updateGreeting,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateGreeting()});
function loginScreen(){
  document.getElementById('view').innerHTML='';
  authBox.innerHTML='<h2>Ingresar a Taller 2.0</h2><p>Entrá con tu cuenta de Google. No necesitás registrarte ni crear una contraseña.</p><button class="google-login" id="googleLogin" type="button"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</button><p id="authMessage" role="status"></p>';
  const button=document.getElementById('googleLogin');
  button.onclick=async()=>{
    button.disabled=true;
    try{await signInWithPopup(auth,googleProvider)}
    catch(err){message(err);button.disabled=false}
  };
}
onAuthStateChanged(auth,async user=>{
  activeUser=null;isAdmin=false;driveAccessToken=null;driveTokenExpiry=0;driveOwnerEmail=DEFAULT_DRIVE_EMAIL;
  if(!user){loginScreen();return}
  document.getElementById('view').innerHTML='';
  authBox.textContent='Cargando tu espacio...';
  try{
    if(!user.providerData.some(p=>p.providerId==='google.com')){
      authBox.innerHTML='<h2>Actualizá tu acceso</h2><p>Para conservar tus notas y permisos de administrador, vinculá esta cuenta existente con Google una sola vez.</p><button class="google-login" id="linkGoogle" type="button"><span class="google-mark">G</span>Vincular con Google</button><button class="settings" id="exitLegacy" type="button">Salir</button><p id="authMessage" role="status"></p>';
      document.getElementById('linkGoogle').onclick=async()=>{
        const btn=document.getElementById('linkGoogle');btn.disabled=true;
        try{await linkWithPopup(user,googleProvider);location.reload()}
        catch(e){message(e);btn.disabled=false}
      };
      document.getElementById('exitLegacy').onclick=()=>signOut(auth);
      return;
    }
    let role=null;
    try{role=await getDoc(doc(db,'roles',user.uid))}
    catch(e){console.warn('No se pudo consultar el rol; se usará acceso estándar.',e.code||e.message)}
    if(auth.currentUser?.uid!==user.uid)return;
    activeUser=user;
    // Se usa la biblioteca fija, sin heredar vínculos antiguos de este dispositivo.
    driveOwnerEmail=DEFAULT_DRIVE_EMAIL;
    if(auth.currentUser?.uid!==user.uid)return;
    isAdmin=!!role&&role.exists()&&role.data().role==='admin';
    authBox.innerHTML='<p id="userWelcome" class="welcome-line"></p><p class="session-line">Sesión: '+esc(user.email||'Cuenta de Google')+' <button class="settings" id="logout" type="button">Cerrar sesión</button></p>';
    updateGreeting();
    document.getElementById('logout').onclick=()=>signOut(auth);
    home();
  }catch(err){
    authBox.innerHTML='<p role="alert">No se pudo cargar tu cuenta. Revisá la conexión y los permisos de Firebase.</p><button class="settings" id="logout" type="button">Salir</button>';
    document.getElementById('logout').onclick=()=>signOut(auth);
    document.getElementById('view').innerHTML='';
  }
});

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function folderId(value){const m=String(value).match(/\/folders\/([\w-]+)/);return m?m[1]:String(value).trim()}function folderUrl(id){const url='https://drive.google.com/drive/folders/'+encodeURIComponent(id);const email=driveOwnerEmail||activeUser?.email;return email?url+'?authuser='+encodeURIComponent(email):url}
const NOTES_KEY="taller20_notas_v1";async function notes(){if(!activeUser)return;const noteRef=doc(db,'users',activeUser.uid,'notes','personal');let value='';try{const snap=await getDoc(noteRef);value=snap.exists()?snap.data().content||'':''}catch(e){alert('No se pudieron cargar tus notas');return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>📝 Mi espacio</h2><p>Tu bloc de notas personal. Se guarda en tu cuenta privada.</p><textarea id="myNotes" placeholder="Anotá tareas, observaciones, recordatorios..." style="width:100%;min-height:320px;resize:vertical;padding:14px;border-radius:10px;background:#122237;color:white;border:1px solid #526a84;font:inherit"></textarea><p id="noteStatus">Los cambios se guardan automáticamente.</p>';const el=document.getElementById("myNotes");el.value=value;el.addEventListener("input",()=>{clearTimeout(window.noteTimer);window.noteTimer=setTimeout(async()=>{try{await setDoc(noteRef,{content:el.value,updatedAt:new Date().toISOString()});document.getElementById("noteStatus").textContent="Guardado en tu espacio privado ✓"}catch(e){document.getElementById("noteStatus").textContent="Error al guardar; revisá tu conexión"}},650)})}function home(){
 if(!activeUser)return;
 view.innerHTML='<button class="settings" onclick="notes()">📝 Mi espacio</button>'+
  (isAdmin?'<button class="settings" onclick="settings()">⚙️ Configuración</button><button class="settings" onclick="manageConnection()">🔗 Gestionar conexión</button>':'')+
  '<h2>Máquinas</h2><div class="grid">'+
  (config.machines.map((m,i)=>'<button class="card" onclick="openMachine('+i+')"><span class="icon">⚙️</span>'+esc(m.name)+'</button>').join('')||'<p>Agregá la primera máquina desde Configuración.</p>')+'</div>';
}
function clearPdfPreview(){if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=null}}
function externalDriveLink(id){return '<p><a href="'+folderUrl(id)+'" target="_blank" rel="noopener">Abrir en Google Drive ↗</a></p>'}
async function openMachine(i){
  if(!activeUser)return;
  clearPdfPreview();
  currentMachineIndex=i;
  const m=config.machines[i];
  if(!m)return home();
  driveTrail=[{id:m.folder,name:m.name}];
  // Con permiso activo, entra directamente al contenido sin abrir otra página.
  if(driveAccessToken&&Date.now()<driveTokenExpiry)return browseDriveFolder();
  // Si el permiso se venció, se intenta renovarlo desde el mismo toque del usuario.
  view.innerHTML='<button type="button" class="back" onclick="home()">← Volver</button><h2>📁 '+esc(m.name)+'</h2><p id="driveStatus" role="status">Conectando con los manuales...</p>';
  try{
    await authorizeDriveAccount();
    if(currentMachineIndex!==i)return;
    browseDriveFolder();
  }catch(e){
    if(currentMachineIndex!==i)return;
    connectDriveScreen();
    const status=document.getElementById('driveStatus');
    if(status)status.textContent=errors[e?.code]||e.message||'No se pudo renovar el permiso de Google.';
  }
}

function driveAccountField(){
  return '<button type="button" class="reconnect-icon" id="connectDrive" aria-label="Reconectar Google Drive" title="Reconectar Drive">⟳</button>';
}
async function authorizeDriveAccount(){
  if(!activeUser||!auth.currentUser||activeUser.uid!==auth.currentUser.uid)throw Error('La sesión de Taller cambió. Volvé a ingresar.');
  const email=DEFAULT_DRIVE_EMAIL;
  driveProvider.setCustomParameters({login_hint:email,prompt:''});
  const candidate=driveAuth.currentUser;
  const sameAccount=candidate?.email?.toLowerCase()===email;
  const result=sameAccount?await reauthenticateWithPopup(candidate,driveProvider):await signInWithPopup(driveAuth,driveProvider);
  const selected=result.user?.email?.trim().toLowerCase();
  if(!selected)throw Error('Google no informó qué cuenta autorizó el acceso.');
  if(selected!==email)throw Error('Google autorizó una cuenta diferente. Para acceder a los manuales, Google debe autorizar la cuenta preconfigurada.');
  const credential=GoogleAuthProvider.credentialFromResult(result);
  if(!credential?.accessToken)throw Error('Google no entregó permiso para leer Drive.');
  await rememberDriveEmail(selected);
  driveAccessToken=credential.accessToken;
  driveTokenExpiry=Date.now()+45*60*1000;
}
function bindConnectionButton(onSuccess){
  const btn=document.getElementById('connectDrive');
  const status=document.getElementById('driveStatus');
  btn.onclick=async()=>{
    btn.disabled=true;if(status)status.textContent=driveOwnerEmail?'Reconectando con la cuenta asociada...':'Validando la cuenta de Drive...';
    try{await authorizeDriveAccount();onSuccess()}
    catch(e){if(status)status.textContent=errors[e?.code]||e.message||'No se pudo conectar Drive';btn.disabled=false}
  };
}
function manageConnection(){
  if(!isAdmin)return home();
  view.innerHTML='<button type="button" class="back" onclick="home()">← Volver</button>'+
    '<h2>🔗 Gestionar conexión</h2>'+
    driveAccountField()+
    '<p class="connection-state" role="status" id="driveStatus"></p>';
  bindConnectionButton(()=>{manageConnection();document.getElementById('driveStatus').textContent='Acceso a Drive renovado ✓'});
}
function connectDriveScreen(){
  if(!activeUser||currentMachineIndex===null)return home();
  const m=config.machines[currentMachineIndex];if(!m)return home();
  view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>'+esc(m.name)+'</h2>'+
    driveAccountField()+
    '<p class="connection-state" id="driveStatus" role="status"></p>';
  bindConnectionButton(()=>browseDriveFolder());
}
async function driveRequest(url,options={}){
  if(!driveAccessToken||Date.now()>driveTokenExpiry){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  const res=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+driveAccessToken}});
  if(res.status===401){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    throw Error(body.error?.message||('Google Drive devolvió error '+res.status));
  }
  return res;
}
function folderHeader(){
  const trail=driveTrail.map((x,i)=>'<button type="button" class="back" data-trail="'+i+'">'+esc(x.name)+'</button>').join(' › ');
  return '<button class="back" onclick="home()">← Máquinas</button><div aria-label="Ruta de carpetas">'+trail+'</div>';
}
function bindTrailButtons(){
  view.querySelectorAll('[data-trail]').forEach(btn=>btn.onclick=()=>{
    const i=Number(btn.dataset.trail);
    driveTrail=driveTrail.slice(0,i+1);browseDriveFolder();
  });
}
async function browseDriveFolder(pageToken=''){
  if(!activeUser||currentMachineIndex===null)return home();
  clearPdfPreview();
  if(!driveAccessToken||Date.now()>driveTokenExpiry)return connectDriveScreen();
  const current=driveTrail[driveTrail.length-1];
  if(!current)return home();
  if(!pageToken){view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2><p>Cargando archivos...</p>';bindTrailButtons()}
  try{
    const id=current.id;
    if(!/^[A-Za-z0-9_-]+$/.test(id))throw Error('Identificador de carpeta inválido');
    const q="'"+id+"' in parents and trashed = false";
    const search=new URLSearchParams({q,fields:'nextPageToken,files(id,name,mimeType,webViewLink,size)',pageSize:'1000',orderBy:'folder,name'});
    if(pageToken)search.set('pageToken',pageToken);
    const response=await driveRequest('https://www.googleapis.com/drive/v3/files?'+search);
    const data=await response.json();
    if(driveTrail[driveTrail.length-1]?.id!==id)return;
    const files=(data.files||[]);
    if(!pageToken){view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2><p>Seleccioná una carpeta o archivo. Se abre dentro de Taller 2.0.</p><div id="driveItems"></div><p id="driveStatus" role="status"></p>';bindTrailButtons()}
    const list=document.getElementById('driveItems');
    if(!list)return;
    if(!files.length&&!pageToken)list.innerHTML='<p>No hay archivos visibles en esta carpeta para la cuenta de manuales.</p>';
    const fragment=document.createDocumentFragment();
    for(const file of files){
      const btn=document.createElement('button');
      btn.type='button';btn.className='card';btn.style.width='100%';btn.style.marginBottom='7px';
      const folder=file.mimeType==='application/vnd.google-apps.folder';
      btn.textContent=(folder?'📁 ':'📄 ')+file.name;
      btn.onclick=()=>{
        if(folder){driveTrail.push({id:file.id,name:file.name});browseDriveFolder()}
        else openDriveFile(file);
      };
      fragment.append(btn);
    }
    list.append(fragment);
    const old=document.getElementById('loadMoreDrive');if(old)old.remove();
    if(data.nextPageToken){
      const more=document.createElement('button');
      more.type='button';more.className='settings';more.id='loadMoreDrive';more.textContent='Cargar más archivos';
      more.onclick=()=>{more.disabled=true;browseDriveFolder(data.nextPageToken)};
      list.after(more);
    }
  }catch(e){
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    const status=document.getElementById('driveStatus');
    if(status)status.textContent='No se pudo leer esta carpeta: '+e.message+'. Volvé a la máquina y reconectá con ⟳ si el permiso venció.';
    else{view.innerHTML=folderHeader()+'<h2>'+esc(current.name)+'</h2><p role="alert">No se pudo abrir la carpeta: '+esc(e.message)+'</p><p>Si la autorización venció, volvé a la máquina y tocá ⟳.</p>';bindTrailButtons()}
  }
}
async function openDriveFile(file){
  if(file.mimeType!=='application/pdf'&&!/\.pdf$/i.test(file.name)){
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2><p>Para este tipo de archivo, abrilo con Google Drive.</p><p><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/'+encodeURIComponent(file.id)+'/view?authuser='+encodeURIComponent(driveOwnerEmail||activeUser.email||'')+'">Abrir archivo ↗</a></p>';
    bindTrailButtons();return;
  }
  view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2><p>Cargando PDF...</p>';bindTrailButtons();
  try{
    const response=await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');
    const blob=await response.blob();
    if(blob.size>60*1024*1024)throw Error('El archivo supera 60 MB y conviene abrirlo desde Google Drive.');
    clearPdfPreview();
    pdfObjectUrl=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2><iframe title="Manual PDF" src="'+pdfObjectUrl+'" style="width:100%;height:75vh;border:1px solid #405c7a;border-radius:8px"></iframe><p><a href="'+pdfObjectUrl+'" download="'+esc(file.name)+'">Descargar PDF</a></p>';
    bindTrailButtons();
  }catch(e){
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2><p role="alert">No se pudo mostrar el PDF: '+esc(e.message)+'</p><p><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/'+encodeURIComponent(file.id)+'/view?authuser='+encodeURIComponent(driveOwnerEmail||activeUser.email||'')+'">Abrir archivo en Drive ↗</a></p>';bindTrailButtons();
  }
}
function settings(){if(!isAdmin){home();return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){localStorage.setItem(KEY,JSON.stringify(config))}function saveRoot(){config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);config.machines.push({name,folder});persist();settings()}
function removeMachine(i){config.machines.splice(i,1);persist();settings()}
Object.assign(window,{home,notes,openMachine,settings,addMachine,removeMachine,saveRoot,manageConnection});
</script></body></html>
