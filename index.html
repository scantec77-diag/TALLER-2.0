<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller 2.0</title><meta name="theme-color" content="#142337">
<style>:root{font-family:system-ui,Arial;color:#edf3fa;background:#0d1726}*{box-sizing:border-box}body{margin:0}header{background:#142337;padding:20px;border-bottom:1px solid #304258}main{max-width:900px;margin:auto;padding:22px}h1{margin:0}p{color:#b7c6d7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{display:flex;align-items:center;gap:9px;background:linear-gradient(110deg,#263d56,#17283d);color:white;border:1px solid #405c7a;border-radius:9px;padding:9px 10px;height:62px;min-height:0;aspect-ratio:auto;text-align:left;cursor:pointer;font-size:.85rem;font-weight:650;overflow-wrap:anywhere;box-shadow:0 2px 8px #0002;transition:transform .15s,border-color .15s}.card:active{transform:scale(.97)}.card:hover{border-color:#75b7ed}.icon{font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex:0 0 30px;margin:0}@media(max-width:420px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{height:58px;padding:7px 8px;font-size:.79rem;gap:6px}.icon{font-size:1.25rem;flex-basis:25px}}button,input{font:inherit}.back,.settings{background:#294563;color:white;border:0;border-radius:9px;padding:10px 14px;margin:8px 8px 8px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #526a84;background:#122237;color:white}label{display:block;margin:12px 0}small{color:#b7c6d7}a{color:#a8d6ff} .google-login{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#202124;border:1px solid #dadce0;border-radius:9px;padding:12px 18px;font-weight:650;cursor:pointer;min-height:46px}.google-login:hover{background:#f2f6fc}.google-login:disabled{opacity:.7;cursor:wait}.google-mark{font-size:1.25rem;font-weight:800;color:#4285f4}</style></head><body><header><h1>🔧 Taller 2.0</h1><p>Biblioteca de máquinas y documentación técnica</p></header><main><div id="view"></div></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, getIdTokenResult, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let activeUser=null,isAdmin=false;
const googleProvider=new GoogleAuthProvider();
const authBox=document.createElement('section');authBox.id='authBox';authBox.setAttribute('aria-live','polite');authBox.textContent='Comprobando tu sesión...';document.querySelector('main').prepend(authBox);
const errors={
  'auth/operation-not-allowed':'El acceso con Google aún no está habilitado en Firebase Authentication.',
  'auth/unauthorized-domain':'Este dominio todavía no está autorizado en Firebase Authentication.',
  'auth/popup-blocked':'El navegador bloqueó la ventana de Google. Habilitá las ventanas emergentes e intentá de nuevo.',
  'auth/popup-closed-by-user':'Se canceló el ingreso. Podés volver a intentarlo.',
  'auth/cancelled-popup-request':'Ya hay una ventana de ingreso abierta.',
  'auth/account-exists-with-different-credential':'Esta dirección ya tiene una cuenta con otro método de ingreso. Para conservar sus datos hay que vincularla con Google.',
  'auth/network-request-failed':'No hay conexión con Firebase. Revisá Internet e intentá nuevamente.'
};
function message(e){const el=document.getElementById('authMessage');if(el)el.textContent=errors[e?.code]||e?.message||String(e)}
function loginScreen(){
  document.getElementById('view').innerHTML='';
  authBox.innerHTML='<h2>Ingresar a Taller 2.0</h2><p>Entrá con tu cuenta de Google. No necesitás registrarte ni crear una contraseña.</p><button class="google-login" id="googleLogin" type="button"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</button><p id="authMessage" role="status"></p>';
  const button=document.getElementById('googleLogin');
  button.onclick=async()=>{
    button.disabled=true;
    try{await signInWithPopup(auth,googleProvider)}
    catch(err){message(err);button.disabled=false}
  };
}
onAuthStateChanged(auth,async user=>{
  activeUser=null;isAdmin=false;
  if(!user){loginScreen();return}
  document.getElementById('view').innerHTML='';
  authBox.textContent='Cargando tu espacio...';
  try{
    const token=await getIdTokenResult(user);
    if(token.signInProvider!=='google.com'){
      await signOut(auth);
      loginScreen();
      message({message:'Para continuar, ingresá con tu cuenta de Google.'});
      return;
    }
    const role=await getDoc(doc(db,'roles',user.uid));
    if(auth.currentUser?.uid!==user.uid)return;
    activeUser=user;
    isAdmin=role.exists()&&role.data().role==='admin';
    authBox.innerHTML='<p>Sesión: '+esc(user.email||user.displayName||'Cuenta de Google')+' <button class="settings" id="logout" type="button">Cerrar sesión</button></p>';
    document.getElementById('logout').onclick=()=>signOut(auth);
    home();
  }catch(err){
    authBox.innerHTML='<p role="alert">No se pudo cargar tu cuenta. Revisá la conexión y los permisos de Firebase.</p><button class="settings" id="logout" type="button">Salir</button>';
    document.getElementById('logout').onclick=()=>signOut(auth);
    document.getElementById('view').innerHTML='';
  }
});
const KEY="taller20_config_v1";let config=JSON.parse(localStorage.getItem(KEY)||'{"root":"11cVCcyrGyjp17oqkjZ5uS93PqstprZ9Y","machines":[]}');if(!config.root)config.root="11cVCcyrGyjp17oqkjZ5uS93PqstprZ9Y";const DRIVE_MACHINES=[{"name":"CONTAINERAS VIEJAS","folder":"1a_L4HR_McfGmnCuTXbgrZlf0xvSuxGPW"},{"name":"GOVERNOR","folder":"1k-WM5uNZb88MNCpKsS7rRffqXoi-8ar1"},{"name":"HYSTER","folder":"1FOgvdSfJZ9AlsTml2I1yU0ROJhcKXSCI"},{"name":"INFO","folder":"1VeBO1uH2mimy2PEJ07gCOpLQY0t2xGg_"},{"name":"INTA","folder":"1iYlZDsIFLqoTXFmrjkkj7StDnnzHhjLJ"},{"name":"KALMAR","folder":"1yZrf4vj5ZHLFkCZjklJ7ly0t38FVNKCK"},{"name":"KONECRANES","folder":"1Js5uk-b2RtAfM18PWFg6qZ4U8Rpb6ob5"},{"name":"LIEBHERR","folder":"1kBoSAqAeIpI3UtHOWWGN8t82cGAZYu-o"},{"name":"LINDE","folder":"17MpMCCTBXCTsANG_UkbEqTZR5pnhPAKf"},{"name":"masterdrive","folder":"1UXMehucxz8AcqfUweE6is2JrBXJNHNxT"},{"name":"noel","folder":"1SUGcDxSE3rIjPaL-p_f7PVC_EsuMFqVe"},{"name":"P02","folder":"1ypQvrsJTftXJE2vUytiSSeISsZ1wsum3"},{"name":"P03","folder":"1_SvG_J2lHT51yYcvT7jWaC4-7yDiEDC_"},{"name":"P04","folder":"1UvnD1-CKrpfxIxJOtvLcNWXj-YXYq39K"},{"name":"P05","folder":"1rIW1383BZGvr3mPVHZjk0vI0qKjud3cg"},{"name":"P06","folder":"1HpC1AdxIOsrNlmQXtzWlJU2U2fG3y14G"},{"name":"P07","folder":"1LAz3z1gHZ90t4VTe9mv4n4vGdGxVGSQD"},{"name":"P08","folder":"1Bq3vlwACX7VVDtstffS6wVwTRvrSzFPj"},{"name":"P09","folder":"1MvUKcXfyEIZR06CCLIIYZWyo7Bz63gKi"},{"name":"P10","folder":"1BM7t2Zha9B0nwYgnYQleO2JV2vrBN1PP"},{"name":"PACECO","folder":"1AX5tDnkEXyZyzhW4IwLhSxOn7n_oRTpT"},{"name":"S7","folder":"1zIMmDXgjZV-R-TUQwFzsqmTM9zNEIPfw"},{"name":"SISU","folder":"1DMljuYrC-amjtpbqaLIaEgKtMV7qd8Yz"}];for(const m of DRIVE_MACHINES){if(!config.machines.some(x=>x.folder===m.folder))config.machines.push(m)}localStorage.setItem(KEY,JSON.stringify(config));const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function folderId(value){const m=String(value).match(/\/folders\/([\w-]+)/);return m?m[1]:String(value).trim()}function folderUrl(id){const url='https://drive.google.com/drive/folders/'+encodeURIComponent(id);return activeUser?.email?url+'?authuser='+encodeURIComponent(activeUser.email):url}
const NOTES_KEY="taller20_notas_v1";async function notes(){if(!activeUser)return;const noteRef=doc(db,'users',activeUser.uid,'notes','personal');let value='';try{const snap=await getDoc(noteRef);value=snap.exists()?snap.data().content||'':''}catch(e){alert('No se pudieron cargar tus notas');return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>📝 Mi espacio</h2><p>Tu bloc de notas personal. Se guarda en tu cuenta privada.</p><textarea id="myNotes" placeholder="Anotá tareas, observaciones, recordatorios..." style="width:100%;min-height:320px;resize:vertical;padding:14px;border-radius:10px;background:#122237;color:white;border:1px solid #526a84;font:inherit"></textarea><p id="noteStatus">Los cambios se guardan automáticamente.</p>';const el=document.getElementById("myNotes");el.value=value;el.addEventListener("input",()=>{clearTimeout(window.noteTimer);window.noteTimer=setTimeout(async()=>{try{await setDoc(noteRef,{content:el.value,updatedAt:new Date().toISOString()});document.getElementById("noteStatus").textContent="Guardado en tu espacio privado ✓"}catch(e){document.getElementById("noteStatus").textContent="Error al guardar; revisá tu conexión"}},650)})}function home(){if(!activeUser)return;view.innerHTML='<button class="settings" onclick="notes()">📝 Mi espacio</button>'+(isAdmin?'<button class="settings" onclick="settings()">⚙️ Configuración</button>':'')+'<h2>Máquinas</h2><div class="grid">'+(config.machines.map((m,i)=>'<button class="card" onclick="openMachine('+i+')"><span class="icon">⚙️</span>'+esc(m.name)+'</button>').join('')||'<p>Agregá la primera máquina desde Configuración.</p>')+'</div>'}
function openMachine(i){const m=config.machines[i];view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>'+esc(m.name)+'</h2><p>Documentación de esta máquina.</p><p><a href="'+folderUrl(m.folder)+'" target="_blank" rel="noopener">📁 Abrir carpeta en Google Drive ↗</a></p><small>Se abrirá con la cuenta de Google que tenga permiso.</small>'}
function settings(){if(!isAdmin){home();return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){localStorage.setItem(KEY,JSON.stringify(config))}function saveRoot(){config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);config.machines.push({name,folder});persist();settings()}
function removeMachine(i){config.machines.splice(i,1);persist();settings()}
Object.assign(window,{home,notes,openMachine,settings,addMachine,removeMachine,saveRoot});
</script></body></html>
