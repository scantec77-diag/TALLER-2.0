<style>:root{font-family:system-ui,Arial;color:#edf3fa;background:#0d1726}*{box-sizing:border-box}body{margin:0}header{background:#142337;padding:20px;border-bottom:1px solid #304258}main{max-width:900px;margin:auto;padding:22px}h1{margin:0}p{color:#b7c6d7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{display:flex;align-items:center;gap:9px;background:linear-gradient(110deg,#263d56,#17283d);color:white;border:1px solid #405c7a;border-radius:9px;padding:9px 10px;height:62px;min-height:0;aspect-ratio:auto;text-align:left;cursor:pointer;font-size:.85rem;font-weight:650;overflow-wrap:anywhere;box-shadow:0 2px 8px #0002;transition:transform .15s,border-color .15s}.card:active{transform:scale(.97)}.card:hover{border-color:#75b7ed}.icon{font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex:0 0 30px;margin:0}@media(max-width:420px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{height:58px;padding:7px 8px;font-size:.79rem;gap:6px}.icon{font-size:1.25rem;flex-basis:25px}}button,input{font:inherit}.back,.settings{background:#294563;color:white;border:0;border-radius:9px;padding:10px 14px;margin:8px 8px 8px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #526a84;background:#122237;color:white}label{display:block;margin:12px 0}small{color:#b7c6d7}a{color:#a8d6ff} .google-login{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#202124;border:1px solid #dadce0;border-radius:9px;padding:12px 18px;font-weight:650;cursor:pointer;min-height:46px}.google-login:hover{background:#f2f6fc}.google-login:disabled{opacity:.7;cursor:wait}.google-mark{font-size:1.25rem;font-weight:800;color:#4285f4}.reconnect-icon{width:54px;height:54px;padding:0;margin:8px 0 12px;border:1px solid #6a94bb;background:#294563;color:white;border-radius:9px;font-size:1.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.reconnect-icon:hover{background:#365c80}.reconnect-icon:disabled{opacity:.5;cursor:wait}.connection-hint{font-size:.88rem;color:#b7c6d7}.connection-state{min-height:24px;color:#cee5fa}.welcome-line{margin:5px 0 8px;font-size:1.13rem;font-weight:750;color:#edf3fa}.session-line{font-size:.85rem;color:#b7c6d7;margin:0 0 12px}.access-sum{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.access-sum span{padding:12px;border:1px solid #405c7a;border-radius:10px;background:#17283d}.access-sum strong{font-size:1.4rem;display:block}.access-person{padding:12px 0;border-bottom:1px solid #304258}.access-person small{display:block;line-height:1.5}.access-person details{margin:10px 0 2px;padding:9px;border:1px solid #405c7a;border-radius:8px;background:#13263b}.access-person summary{cursor:pointer;font-weight:650}.access-person h3{font-size:1rem;margin:16px 0 8px}.access-library-item{padding:8px 0;border-bottom:1px solid #304258;overflow-wrap:anywhere}.access-library-item strong{font-size:.9rem}
#commonAlerts{position:fixed;top:12px;right:12px;width:min(390px,calc(100vw - 24px));z-index:1000;display:grid;gap:8px}.common-alert{display:flex;background:#203c58;border:1px solid #75b7ed;border-radius:12px;box-shadow:0 6px 24px #0008;overflow:hidden}.common-alert-open{flex:1;min-width:0;background:none;border:0;color:#edf3fa;text-align:left;padding:14px;cursor:pointer}.common-alert-open strong,.common-alert-open span{display:block;overflow-wrap:anywhere}.common-alert-open span{margin-top:6px;font-size:.9rem;color:#d4e4f4}.common-alert-close{align-self:flex-start;background:none;border:0;color:white;font-size:1.6rem;min-width:44px;min-height:44px;cursor:pointer}
.card.card-info{background:#ccecff;color:#1255a0;border-color:#86c5ec;font-family:Arial,Helvetica,sans-serif;font-size:clamp(17px,4.5vw,21px);font-weight:850;letter-spacing:.2px}.card.card-info:hover{background:#bce5ff;border-color:#357ec1}

.card.card-hyster{background:#ffdf00;color:#fff;border-color:#b59b00}
.card.card-hyster:hover{background:#ffe633;border-color:#181818}
.hyster-label{font-family:Arial,Helvetica,sans-serif;font-size:clamp(22px,5.8vw,30px);font-weight:900;line-height:1.1;color:#fff;-webkit-text-fill-color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.card.card-konecranes{background:#87ceeb;color:#000;border-color:#58a9cc;font-family:Arial,Helvetica,sans-serif;font-size:clamp(17px,4.4vw,21px);font-weight:800}
.card.card-konecranes:hover{background:#a3ddf3;border-color:#287fa4}
.card.card-linde{background:#e32227;color:#fff;border-color:#a20f14}
.card.card-linde:hover{background:#f13237;border-color:#730a0e}
.linde-label{font-family:Arial,Helvetica,sans-serif;font-size:clamp(20px,5vw,24px);font-weight:800;line-height:1.15;color:#fff;-webkit-text-fill-color:#fff;-webkit-text-stroke:1.3px #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.ui-version{font-size:.75rem;font-weight:600;color:#90bedc;white-space:nowrap}.app-brand{display:flex;align-items:center;gap:14px}.app-logo{display:block;width:88px;height:66px;object-fit:contain;border-radius:10px;border:1px solid #526a84;flex-shrink:0}@media(max-width:420px){.app-brand{font-size:1.7rem;gap:12px}.app-logo{width:80px;height:60px}}

/* Clima y ubicación al lado izquierdo del saludo */
.greeting-weather-row{display:flex;align-items:center;gap:14px;min-width:0;margin:5px 0 12px}
.greeting-weather-row .welcome-line{flex:1;min-width:0;margin:0;font-size:1.13rem;line-height:1.45}
.weather-card{flex:0 0 160px;width:160px;min-height:123px;padding:10px 11px;border:1px solid #517fa4;border-radius:12px;background:linear-gradient(145deg,#254a68,#142d45);color:#fff;box-shadow:0 3px 12px #0003}
.weather-eyebrow{font-size:.72rem;font-weight:700;color:#b7e3ff}
.weather-place{font-size:.82rem;font-weight:800;margin-top:5px;line-height:1.2;overflow-wrap:anywhere}
.weather-reading{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.weather-reading span{font-size:1.65rem}.weather-reading strong{font-size:1.8rem;line-height:1;white-space:nowrap}
.weather-description{font-size:.7rem;color:#dbe9f6;line-height:1.3}
.weather-retry{margin-top:6px;background:#d4ebff;color:#16324b;padding:5px 8px;border:0;border-radius:6px;font-size:.73rem;font-weight:700;cursor:pointer}
.weather-retry[hidden]{display:none}
.weather-credit{display:block;margin-top:5px;font-size:.64rem;color:#b5cfe2}.weather-credit a{color:#c4e8ff}
@media(max-width:420px){.greeting-weather-row{gap:9px}.weather-card{flex-basis:145px;width:145px;padding:9px}.greeting-weather-row .welcome-line{font-size:1.03rem}.weather-reading strong{font-size:1.65rem}}

// Tarjeta de clima: consulta el GPS del dispositivo SOLO mientras Taller 2.0 está abierto.
// El usuario debe conceder ubicación; no se guarda ni se publica la posición en Firebase.
const WEATHER_REFRESH_MS=10*60*1000;
let weatherWatchId=null,weatherLastFix=null,weatherLastFetchedAt=0,weatherRequestSerial=0,weatherAbortController=null;
function weatherText(id,value){const el=document.getElementById(id);if(el)el.textContent=value}
function weatherShowRetry(show){const el=document.getElementById('weatherRetry');if(el)el.hidden=!show}
function weatherDistance(a,b){
  const rad=Math.PI/180,dLat=(b.latitude-a.latitude)*rad,dLon=(b.longitude-a.longitude)*rad;
  const x=Math.sin(dLat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dLon/2)**2;
  return 12742000*Math.asin(Math.min(1,Math.sqrt(x)));
}
function weatherCondition(code,isDay){
  if(code===0)return [isDay?'☀️':'🌙','Despejado'];
  if(code===1||code===2)return [isDay?'🌤️':'☁️','Algo nublado'];
  if(code===3)return ['☁️','Nublado'];
  if(code===45||code===48)return ['🌫️','Niebla'];
  if(code>=51&&code<=57)return ['🌦️','Llovizna'];
  if((code>=61&&code<=67)||(code>=80&&code<=82))return ['🌧️','Lluvia'];
  if((code>=71&&code<=77)||(code>=85&&code<=86))return ['🌨️','Nieve'];
  if(code>=95)return ['⛈️','Tormenta'];
  return ['🌡️','Clima actual'];
}
function weatherLocationError(error){
  if(!activeUser||!document.getElementById('weatherCard'))return;
  // Conserva la última temperatura cuando el teléfono pierde señal momentáneamente.
  if(weatherLastFix&&document.getElementById('weatherTemperature')?.textContent!=='--°'){
    weatherText('weatherDescription','Ubicación momentáneamente no disponible');
  }else{
    weatherText('weatherLocation','Ubicación no disponible');
    weatherText('weatherDescription',error?.code===1?'Activá el permiso de ubicación del teléfono.':'No se pudo obtener la ubicación.');
  }
  weatherShowRetry(true);
}
async function weatherUpdate(position){
  if(!activeUser||!document.getElementById('weatherCard'))return;
  const latitude=Number(position?.coords?.latitude),longitude=Number(position?.coords?.longitude);
  if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;
  const coords={latitude,longitude},now=Date.now();
  if(weatherLastFix&&weatherDistance(weatherLastFix,coords)<900&&now-weatherLastFetchedAt<WEATHER_REFRESH_MS)return;

  if(weatherAbortController)weatherAbortController.abort();
  const controller=new AbortController();weatherAbortController=controller;
  weatherText('weatherDescription','Actualizando…');
  weatherShowRetry(false);
  const ll='latitude='+encodeURIComponent(latitude.toFixed(5))+'&longitude='+encodeURIComponent(longitude.toFixed(5));
  const weatherUrl='https://api.open-meteo.com/v1/forecast?'+ll+'&current=temperature_2m,apparent_temperature,weather_code,is_day&timezone=auto';
  const placeUrl='https://api.bigdatacloud.net/data/reverse-geocode-client?'+ll+'&localityLanguage=es';

      const g=geocode.value||{},locality=String(g.locality||'').trim(),city=String(g.city||'').trim();

const COMMON_TEXT_BYTES=1040000, COMMON_PHOTO_CHARS=320000, COMMON_PHOTO_COUNT=4;
function commonTextBytes(text){return new TextEncoder().encode(text).length}
async function compressCommonPhoto(file){
  if(!/^image\/(jpeg|png|webp|gif|bmp|heic|heif)$/i.test(file.type))throw Error('Elegí una foto JPG, PNG o WebP. Si el formato no abre, convertí la foto a JPG.');
  if(file.size>20*1024*1024)throw Error('La foto supera los 20 MB. Elegí una copia más pequeña.');
  const url=URL.createObjectURL(file),img=new Image();
  try{
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('No se pudo abrir la foto. Probá guardarla como JPG.'));img.src=url});
    let edge=1600;
    for(let pass=0;pass<6;pass++,edge=Math.round(edge*.75)){
      const scale=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      for(const quality of [.85,.7,.55]){
        const dataUrl=canvas.toDataURL('image/jpeg',quality);
        if(dataUrl.length<=COMMON_PHOTO_CHARS)return dataUrl;
      }
    }
    throw Error('No se pudo reducir la foto. Elegí otra imagen.');
  }finally{URL.revokeObjectURL(url)}
}

  }

  function openPhoto(src,alt){

  function makeCard(item){

        if(!current()||!card.isConnected)return;

    card.append(date);return card;
  }
  async function loadMessages(append=false){
    if(!current()||loading)return;
    loading=true;refresh.disabled=true;more.disabled=true;status.textContent='Cargando mensajes...';
    try{
      const constraints=[orderBy('createdAt','desc'),limit(personId?80:30)];
      if(append&&cursor)constraints.push(startAfter(cursor));
      const snap=await getDocs(query(collection(db,'commonMessages'),...constraints));
      if(!current())return;
      if(!append)list.replaceChildren();
      const matching=personId?snap.docs.filter(d=>d.data().authorId===personId):snap.docs;
      // Los más antiguos se colocan arriba: orden cronológico como WhatsApp.
      const wasAtBottom=list.scrollHeight-list.scrollTop-list.clientHeight<100;
      const batch=document.createDocumentFragment();for(const item of matching.slice().reverse())batch.append(makeCard(item));if(append)list.prepend(batch);else list.append(batch);
      cursor=snap.docs[snap.docs.length-1]||null;
      more.hidden=snap.size<(personId?80:30);
      status.textContent=personId?'Historial de '+personName+(more.hidden?'':' · Ver anteriores para buscar más'):(list.children.length?'Mensajes guardados':'Todavía no hay mensajes');
      if(!append||wasAtBottom)list.scrollTop=list.scrollHeight;
    }catch(e){if(current())status.textContent=explain(e)}
    finally{loading=false;if(current()){refresh.disabled=false;more.disabled=false}}
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    if(saving||preparing||!current())return;
    const text=input.value.trim();
    if(!text&&!photos.length){sendStatus.textContent='Escribí un mensaje o agregá una foto.';return}
    if(commonTextBytes(text)>COMMON_TEXT_BYTES){sendStatus.textContent='El texto supera la capacidad. Dividilo en dos publicaciones.';return}
    saving=true;send.disabled=true;input.disabled=true;choose.disabled=true;paintPhotos();sendStatus.textContent='Publicando...';
    try{
      const profile=user.providerData?.find(p=>p.providerId==='google.com');
      const ref=doc(collection(db,'commonMessages')),batch=writeBatch(db);
      const message={authorId:user.uid,authorName:String(profile?.displayName||user.displayName||'Usuario').trim().slice(0,120)||'Usuario',text,createdAt:serverTimestamp()};
      if(photos.length)message.photoCount=photos.length;
      batch.set(ref,message);
      photos.forEach((dataUrl,i)=>batch.set(doc(db,'commonMessages',ref.id,'photos',String(i)),{authorId:user.uid,dataUrl,createdAt:serverTimestamp()}));
      await batch.commit();
      if(!current())return;
      input.value='';photos=[];count();sendStatus.textContent='Publicación guardada ✓';
      await loadMessages();
    }catch(e){if(current())sendStatus.textContent=explain(e)+' El texto y las fotos siguen disponibles para reintentar.'}
    finally{saving=false;if(current()){send.disabled=false;input.disabled=false;choose.disabled=false;paintPhotos()}}
  };
  refresh.onclick=()=>loadMessages(false);more.onclick=()=>loadMessages(true);loadMessages(false);
  // Aviso de mensajes nuevos para actualizar el chat sin recargar toda la página.
  liveStop=onSnapshot(query(collection(db,'commonMessages'),orderBy('createdAt','desc'),limit(1)),snap=>{
    if(!current()){liveStop?.();return}
    if(!snap.metadata.fromCache&&!personId&&!loading)loadMessages(false);
  },error=>console.warn('Actualización de chat:',error.code||error.message));
}

async function openDirectLibrary(m){

async function authorizeDriveAccount(){
  if(!activeUser||!auth.currentUser||activeUser.uid!==auth.currentUser.uid)throw Error('La sesión de Taller cambió. Volvé a ingresar.');
  const email=DEFAULT_DRIVE_EMAIL;
  driveProvider.setCustomParameters({login_hint:email,prompt:''});
  const candidate=driveAuth.currentUser;
  const sameAccount=candidate?.email?.toLowerCase()===email;
  const result=sameAccount?await reauthenticateWithPopup(candidate,driveProvider):await signInWithPopup(driveAuth,driveProvider);
  const selected=result.user?.email?.trim().toLowerCase();
  if(!selected)throw Error('Google no informó qué cuenta autorizó el acceso.');
  if(selected!==email)throw Error('Google autorizó una cuenta diferente. Para acceder a los manuales, Google debe autorizar la cuenta preconfigurada.');
  const credential=GoogleAuthProvider.credentialFromResult(result);
  if(!credential?.accessToken)throw Error('Google no entregó permiso para leer Drive.');
  await rememberDriveEmail(selected);
  driveAccessToken=credential.accessToken;
  driveTokenExpiry=Date.now()+45*60*1000;
}

async function driveRequest(url,options={}){
  if(!driveAccessToken||Date.now()>driveTokenExpiry){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  const res=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+driveAccessToken}});
  if(res.status===401){driveAccessToken=null;throw Error('AUTH_NEEDED')}
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    throw Error(body.error?.message||('Google Drive devolvió error '+res.status));
  }
  return res;
}

function paintDriveFiles(){
  const listing=driveListing,el=document.getElementById('driveItems');
  if(!listing||!el||driveTrail[driveTrail.length-1]?.id!==listing.folderId)return;
  const text=String(document.getElementById('driveSearch')?.value||'').trim().toLocaleLowerCase('es');
  if(text!==listing.query){listing.query=text;listing.page=0}
  const found=text?listing.files.filter(f=>f.name.toLocaleLowerCase('es').includes(text)):listing.files;
  const perPage=80,total=found.length,pages=Math.max(1,Math.ceil(total/perPage));
  listing.page=Math.max(0,Math.min(listing.page,pages-1));
  const start=listing.page*perPage;
  const fragment=document.createDocumentFragment();
  for(const file of found.slice(start,start+perPage)){
    const btn=document.createElement('button');
    btn.type='button';btn.className='card';
    btn.style.width='100%';btn.style.marginBottom='7px';
    const folder=file.mimeType==='application/vnd.google-apps.folder';
    const pdf=file.mimeType==='application/pdf'||/\.pdf$/i.test(file.name);
    btn.textContent=(folder?'📁 ':pdf?'📕 ':'📄 ')+file.name;
    btn.onclick=()=>folder?(driveTrail.push({id:file.id,name:file.name}),browseDriveFolder()):openDriveFile(file);
    fragment.appendChild(btn);
  }
  el.replaceChildren(fragment);
  if(!total)el.textContent=listing.loading?'Buscando archivos…':text?'No hay archivos con ese nombre.':'Esta carpeta no contiene archivos visibles.';
  const count=document.getElementById('driveCount');
  if(count)count.textContent=(listing.loading?'Leyendo carpeta… ':'')+
    listing.files.length+' elementos cargados'+(text?' · '+total+' coincidencias':'')+
    (listing.loading?' (continúa la carga)':'');
  const nav=document.getElementById('drivePages');
  if(nav){
    nav.innerHTML=total>perPage?'<button type="button" class="settings" id="drivePrevious">← Anterior</button> '+
      '<span>Página '+(listing.page+1)+' de '+pages+'</span> '+
      '<button type="button" class="settings" id="driveNext">Siguiente →</button>':'';
    const prev=document.getElementById('drivePrevious'),next=document.getElementById('driveNext');
    if(prev){prev.disabled=listing.page===0;prev.onclick=()=>{listing.page--;paintDriveFiles();window.scrollTo({top:0,behavior:'smooth'})}}
    if(next){next.disabled=listing.page>=pages-1;next.onclick=()=>{listing.page++;paintDriveFiles();window.scrollTo({top:0,behavior:'smooth'})}}
  }
}
async function browseDriveFolder(){
  if(!activeUser||currentMachineIndex===null)return home();
  clearPdfPreview();
  if(!driveAccessToken||Date.now()>driveTokenExpiry)return connectDriveScreen();
  const current=driveTrail[driveTrail.length-1];
  if(!current)return home();
  const id=current.id,version=++driveListVersion;
  let visitLogged=false;
  if(!/^[A-Za-z0-9_-]+$/.test(id))return;
  driveListing={folderId:id,files:[],query:'',page:0,loading:true};
  view.innerHTML=folderHeader()+'<h2>📁 '+esc(current.name)+'</h2>'+
    '<p>Carpetas, PDF y demás documentos. Podés buscar por nombre.</p>'+
    '<label>Buscar en esta carpeta<input id="driveSearch" type="search" placeholder="Nombre del archivo o manual…"></label>'+
    '<p id="driveCount" role="status">Leyendo carpeta…</p>'+
    '<div id="driveItems"></div><div id="drivePages"></div>'+
    '<p id="driveStatus" role="status"></p>';
  bindTrailButtons();
  document.getElementById('driveSearch').addEventListener('input',paintDriveFiles);
  paintDriveFiles();
  let pageToken='';
  try{
    do{
      const q="'"+id+"' in parents and trashed = false";
      const search=new URLSearchParams({q,fields:'nextPageToken,files(id,name,mimeType,webViewLink,size)',pageSize:'1000',orderBy:'folder,name'});
      if(pageToken)search.set('pageToken',pageToken);
      const response=await driveRequest('https://www.googleapis.com/drive/v3/files?'+search);
      const data=await response.json();
      if(version!==driveListVersion||driveTrail[driveTrail.length-1]?.id!==id||!document.getElementById('driveItems'))return;
      if(!visitLogged){visitLogged=true;recordLibraryVisit('folder',id,current.name,driveTrail.map(x=>x.name).join(' / '));}
      driveListing.files.push(...(data.files||[]));
      pageToken=data.nextPageToken||'';
      driveListing.loading=!!pageToken;
      paintDriveFiles();
    }while(pageToken);
  }catch(e){
    if(version!==driveListVersion)return;
    driveListing.loading=false;
    paintDriveFiles();
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    const status=document.getElementById('driveStatus');
    if(status)status.textContent='La lectura se interrumpió: '+e.message+
      '. Se conservan los '+driveListing.files.length+' archivos recuperados. Reconectá con ⟳ para continuar.';
  }finally{
    if(version===driveListVersion&&driveListing){driveListing.loading=false;paintDriveFiles()}
  }
}
async function openDriveFile(file){
  const version=++driveListVersion;
  clearPdfPreview();
  recordLibraryVisit('file',file.id,file.name,[...driveTrail.map(x=>x.name),file.name].join(' / '));
  const driveLink=driveFileLink(file);
  if(file.mimeType!=='application/pdf'&&!/\.pdf$/i.test(file.name)){
    view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
      '<p>Este documento se abre en su aplicación compatible.</p>'+

  }
  view.innerHTML=folderHeader()+'<h2>'+esc(file.name)+'</h2>'+
    '<p id="pdfStatus" role="status">Cargando PDF…</p>'+
    '<p><a target="_blank" rel="noopener" href="'+driveLink+'">Abrir en Google Drive ↗</a></p>';
  bindTrailButtons();
  const originalStatus=document.getElementById('pdfStatus');
  const current=()=>version===driveListVersion&&originalStatus?.isConnected&&!!activeUser;
  try{
    const response=await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');
    const blob=await response.blob();
    if(!current())return;
    clearPdfPreview();
    pdfObjectUrl=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    const status=document.getElementById('pdfStatus');
    if(!status)return;
    const lib=window.pdfjsLib;
    const download='<p><a href="'+pdfObjectUrl+'" download="'+esc(file.name)+'">⬇ Descargar PDF</a> · '+
      '<a target="_blank" rel="noopener" href="'+driveLink+'">Abrir en Drive ↗</a></p>';
    if(!lib){
      status.textContent='Usando el visor del navegador.';
      status.insertAdjacentHTML('afterend','<iframe title="Manual PDF" src="'+pdfObjectUrl+
        '" style="width:100%;height:75vh;border:1px solid #405c7a;border-radius:8px"></iframe>'+download);
      return;
    }
    lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await lib.getDocument({url:pdfObjectUrl,isEvalSupported:false}).promise;
    if(!current())return;
    let page=1,seq=0,rendering=false;
    status.insertAdjacentHTML('afterend','<div id="pdfControls">'+
      '<button class="settings" id="pdfPrev" type="button">← Anterior</button>'+
      '<span id="pdfNumber"></span>'+
      '<button class="settings" id="pdfNext" type="button">Siguiente →</button></div>'+
      '<canvas id="pdfCanvas" style="display:block;max-width:100%;margin:12px auto;background:white"></canvas>'+download);
    const canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d');
    async function renderPage(){
      if(rendering||!current())return;
      rendering=true;
      try{
      const ticket=++seq;
      const one=await pdf.getPage(page);
      if(ticket!==seq||!canvas.isConnected)return;
      const natural=one.getViewport({scale:1});
      const width=Math.max(250,Math.min(900,view.clientWidth-12));
      const scale=width/natural.width;
      const pixelRatio=Math.min(window.devicePixelRatio||1,2);
      const viewport=one.getViewport({scale:scale*pixelRatio});
      canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);
      canvas.style.width=Math.round(viewport.width/pixelRatio)+'px';
      canvas.style.height=Math.round(viewport.height/pixelRatio)+'px';
      await one.render({canvasContext:ctx,viewport}).promise;
      if(ticket===seq&&canvas.isConnected){
        status.textContent='PDF cargado';
        document.getElementById('pdfNumber').textContent=' Página '+page+' de '+pdf.numPages+' ';
        document.getElementById('pdfPrev').disabled=page<=1;
        document.getElementById('pdfNext').disabled=page>=pdf.numPages;
      }
      }catch(e){if(current())status.textContent='No se pudo mostrar la página: '+e.message}
      finally{rendering=false}
    }
    document.getElementById('pdfPrev').onclick=()=>{if(!rendering&&page>1){page--;renderPage()}};
    document.getElementById('pdfNext').onclick=()=>{if(!rendering&&page<pdf.numPages){page++;renderPage()}};
    await renderPage();
  }catch(e){
    if(!current())return;
    if(e.message==='AUTH_NEEDED')return connectDriveScreen();
    const status=document.getElementById('pdfStatus');
    if(status)status.textContent='No se pudo mostrar el PDF en este dispositivo ('+e.message+
      '). Podés abrirlo mediante el enlace de Google Drive.';
  }
}
function settings(){if(!isAdmin){home();return}view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(config))}catch(e){console.warn('No se pudo guardar la configuración local.',e)}}function saveRoot(){if(!isAdmin)return;config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){if(!isAdmin)return;const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);if(!/^[A-Za-z0-9_-]{8,160}$/.test(folder)){alert("Ingresá un enlace o ID válido de carpeta de Drive.");return}config.removed=config.removed.filter(id=>id!==folder);if(!config.machines.some(m=>m.folder===folder))config.machines.push({name,folder});persist();settings()}
function removeMachine(i){if(!isAdmin||!config.machines[i])return;config.removed.push(config.machines[i].folder);config.machines.splice(i,1);persist();settings()}
Object.assign(window,{home,notes,commonSpace,pushSettings,openMachine,settings,addMachine,removeMachine,saveRoot,manageConnection,accessDashboard});
</script></body></html>
