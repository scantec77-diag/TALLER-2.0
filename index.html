<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller 2.0</title><meta name="theme-color" content="#142337">
<style>:root{font-family:system-ui,Arial;color:#edf3fa;background:#0d1726}*{box-sizing:border-box}body{margin:0}header{background:#142337;padding:20px;border-bottom:1px solid #304258}main{max-width:900px;margin:auto;padding:22px}h1{margin:0}p{color:#b7c6d7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#1c2c40;color:white;border:1px solid #38506c;border-radius:16px;padding:24px 14px;min-height:140px;text-align:left;cursor:pointer;font-size:1.15rem}.icon{font-size:2rem;display:block;margin-bottom:12px}button,input{font:inherit}.back,.settings{background:#294563;color:white;border:0;border-radius:9px;padding:10px 14px;margin:8px 8px 8px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #526a84;background:#122237;color:white}label{display:block;margin:12px 0}small{color:#b7c6d7}a{color:#a8d6ff}</style></head><body><header><h1>🔧 Taller 2.0</h1><p>Biblioteca de máquinas y documentación técnica</p></header><main><div id="view"></div></main>
<script>
const KEY="taller20_config_v1";let config=JSON.parse(localStorage.getItem(KEY)||'{"root":"","machines":[]}');const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function folderId(value){const m=String(value).match(/\/folders\/([\w-]+)/);return m?m[1]:String(value).trim()}function folderUrl(id){return 'https://drive.google.com/drive/folders/'+encodeURIComponent(id)}
function home(){view.innerHTML='<button class="settings" onclick="settings()">⚙️ Configuración</button><h2>Máquinas</h2><div class="grid">'+(config.machines.map((m,i)=>'<button class="card" onclick="openMachine('+i+')"><span class="icon">⚙️</span>'+esc(m.name)+'</button>').join('')||'<p>Agregá la primera máquina desde Configuración.</p>')+'</div>'}
function openMachine(i){const m=config.machines[i];view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>'+esc(m.name)+'</h2><p>Documentación de esta máquina.</p><p><a href="'+folderUrl(m.folder)+'" target="_blank" rel="noopener">📁 Abrir carpeta en Google Drive ↗</a></p><small>Se abrirá con la cuenta de Google que tenga permiso.</small>'}
function settings(){view.innerHTML='<button class="back" onclick="home()">← Volver</button><h2>Configuración</h2><p>Esta primera versión utiliza enlaces de carpetas de Drive.</p><label>Carpeta principal de Drive<input id="root" placeholder="Enlace o ID de carpeta" value="'+esc(config.root)+'"></label><h3>Agregar máquina</h3><label>Nombre<input id="machineName" placeholder="Ej.: Torno CNC"></label><label>Carpeta de esa máquina<input id="machineFolder" placeholder="Enlace o ID de carpeta"></label><button class="settings" onclick="addMachine()">+ Agregar máquina</button><h3>Máquinas configuradas</h3><div id="machineList"></div><button class="settings" onclick="saveRoot()">Guardar carpeta principal</button>';renderList()}
function renderList(){document.getElementById('machineList').innerHTML=config.machines.map((m,i)=>'<p>'+esc(m.name)+' <button class="back" onclick="removeMachine('+i+')">Eliminar</button></p>').join('')||'<p>Todavía no hay máquinas.</p>'}
function persist(){localStorage.setItem(KEY,JSON.stringify(config))}function saveRoot(){config.root=folderId(document.getElementById('root').value);persist();home()}
function addMachine(){const name=document.getElementById('machineName').value.trim(),folder=folderId(document.getElementById('machineFolder').value);if(!name||!folder){alert('Completá nombre y carpeta.');return}config.root=folderId(document.getElementById('root').value);config.machines.push({name,folder});persist();settings()}
function removeMachine(i){config.machines.splice(i,1);persist();settings()}home();
</script></body></html>
