name: Publicar Taller 2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Respaldo para cambios que llegan desde integraciones sin generar un push event.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taller-2-0-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener versión actual
        uses: actions/checkout@v4

      - name: Comprobar código y regresiones
        run: node --test tests/*.test.cjs

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos web
        shell: bash
        run: |
          mkdir -p _site/assets _site/updates
          BUILD_VERSION="main-${GITHUB_SHA}"
          sed -E "s/data-app-version=\"[^\"]*\"/data-app-version=\"${BUILD_VERSION}\"/" index.html > _site/index.html
          sed "s/__TALLER_BUILD_VERSION__/${BUILD_VERSION}/g" firebase-messaging-sw.js > _site/firebase-messaging-sw.js
          cp firebase-config.js push-config.js push-notifications.js app-updates.js manual-content-search.js manual-ocr.js library-server.js progressive-pdf.js taller-ia.js taller-ia.css _site/
          cat > _site/updates/stable.json <<EOF
          {"channel":"stable","version":"${BUILD_VERSION}","commit":"${GITHUB_SHA}","updatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","url":"https://scantec77-diag.github.io/TALLER-2.0/"}
          EOF
          cp -R assets/. _site/assets/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app-updates.js
          test -f _site/updates/stable.json
          ! grep -q '__TALLER_BUILD_VERSION__' _site/index.html
          ! grep -q 'data-app-version="__TALLER_BUILD_VERSION__"' _site/index.html
          test -f _site/progressive-pdf.js
          test -f _site/taller-ia.js
          test -f _site/taller-ia.css
          grep -q 'card-sisu' _site/index.html

      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4

      # El sitio también está configurado para publicar la rama main. Dejar estos
      # archivos renderizados en la rama mantiene visible el canal estable ahí.
      - name: Sincronizar versión y canal con la rama publicada
        shell: bash
        run: |
          cp _site/index.html index.html
          cp _site/firebase-messaging-sw.js firebase-messaging-sw.js
          mkdir -p updates
          cp _site/updates/stable.json updates/stable.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase-messaging-sw.js updates/stable.json
          if git diff --cached --quiet; then
            echo "La rama ya contiene la versión estable actual."
            exit 0
          fi
          git commit -m "chore: publicar canal estable [skip ci]"
          git push
