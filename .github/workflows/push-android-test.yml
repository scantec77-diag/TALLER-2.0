name: Prueba APK Push sin servicios pagos
on:
  push:
    branches: [feature/push-cerrada-20261024]
  pull_request:
    branches: [apk-prueba-taller-2-0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TALLER_FIREBASE_ANDROID_APP_ID: ${{ vars.TALLER_FIREBASE_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verificar estado de configuración
        run: |
          if [ -n "$TALLER_FIREBASE_ANDROID_APP_ID" ]; then
            echo "Aplicación Firebase Android configurada: sí"
          else
            echo "::warning::Falta variable TALLER_FIREBASE_ANDROID_APP_ID. APK compila, pero las push nativas aún no podrán funcionar."
          fi
      - name: Compilar APK de prueba
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Taller-2.0-Push-Prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
